<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">HackerTok</title>
  <desc id="og-desc">Your daily dose of Hacker News</desc>

  <!--
    Light-theme variant of og-image.svg for GitHub's
    prefers-color-scheme <picture> support.
  -->
  <style><![CDATA[
    /* Mid layer — 15–25s, ~22–32px drifts. */
    .hk-r1  { animation: hk-roam-1 17s ease-in-out infinite; }
    .hk-r2  { animation: hk-roam-2 19s ease-in-out infinite; }
    .hk-r3  { animation: hk-roam-3 21s ease-in-out infinite; }
    .hk-r4  { animation: hk-roam-4 25s ease-in-out infinite; }
    .hk-r5  { animation: hk-roam-5 22s ease-in-out infinite; }
    .hk-r6  { animation: hk-roam-6 18s ease-in-out infinite; }
    .hk-r1b { animation: hk-roam-1 15s ease-in-out infinite -1.2s; }
    .hk-r2b { animation: hk-roam-2 24s ease-in-out infinite -0.5s; }
    .hk-r3b { animation: hk-roam-3 20s ease-in-out infinite -2.3s; }
    .hk-r1c { animation: hk-roam-1 21s ease-in-out infinite -3.1s; }
    .hk-r2c { animation: hk-roam-2 16s ease-in-out infinite -1.7s; }
    .hk-r3c { animation: hk-roam-3 24s ease-in-out infinite -0.8s; }

    /* Far layer — 21–34s, ~8–18px drifts (background shimmer) */
    .hk-f1 { animation: hk-far-1 21s ease-in-out infinite; }
    .hk-f2 { animation: hk-far-2 24s ease-in-out infinite; }
    .hk-f3 { animation: hk-far-3 27s ease-in-out infinite; }
    .hk-f4 { animation: hk-far-4 31s ease-in-out infinite; }
    .hk-f5 { animation: hk-far-5 28s ease-in-out infinite; }
    .hk-f6 { animation: hk-far-6 34s ease-in-out infinite; }

    .hk-s1 { animation: hk-spin-1 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .hk-s2 { animation: hk-spin-2 16s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .hk-s3 { animation: hk-spin-3 20s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .hk-s4 { animation: hk-spin-4 13s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    .hk-glitch-r { animation: hk-glitch-r 13s step-end infinite; }
    .hk-glitch-c { animation: hk-glitch-c 19s step-end infinite; }

    @keyframes hk-roam-1 {
      0%, 100% { transform: translate(0, 0); }
      25%      { transform: translate(14px, -22px); }
      50%      { transform: translate(-8px, -32px); }
      75%      { transform: translate(22px, -12px); }
    }
    @keyframes hk-roam-2 {
      0%, 100% { transform: translate(0, 0); }
      33%      { transform: translate(-24px, 12px); }
      66%      { transform: translate(18px, -18px); }
    }
    @keyframes hk-roam-3 {
      0%, 100% { transform: translate(0, 0); }
      25%      { transform: translate(22px, 18px); }
      50%      { transform: translate(-14px, 24px); }
      75%      { transform: translate(-24px, -10px); }
    }
    @keyframes hk-roam-4 {
      0%, 100% { transform: translate(0, 0); }
      25%      { transform: translate(12px, 6px); }
      50%      { transform: translate(24px, 18px); }
      75%      { transform: translate(8px, 22px); }
    }
    @keyframes hk-roam-5 {
      0%, 100% { transform: translate(0, 0); }
      35%      { transform: translate(-6px, -28px); }
      65%      { transform: translate(10px, 10px); }
    }
    @keyframes hk-roam-6 {
      0%, 100% { transform: translate(0, 0); }
      20%      { transform: translate(16px, -10px); }
      40%      { transform: translate(-12px, -8px); }
      60%      { transform: translate(8px, 18px); }
      80%      { transform: translate(-18px, 8px); }
    }
    @keyframes hk-far-1 {
      0%, 100% { transform: translate(0, 0); }
      25%      { transform: translate(8px, -12px); }
      50%      { transform: translate(-5px, -18px); }
      75%      { transform: translate(12px, -7px); }
    }
    @keyframes hk-far-2 {
      0%, 100% { transform: translate(0, 0); }
      33%      { transform: translate(-14px, 8px); }
      66%      { transform: translate(10px, -10px); }
    }
    @keyframes hk-far-3 {
      0%, 100% { transform: translate(0, 0); }
      25%      { transform: translate(12px, 9px); }
      50%      { transform: translate(-8px, 14px); }
      75%      { transform: translate(-14px, -5px); }
    }
    @keyframes hk-far-4 {
      0%, 100% { transform: translate(0, 0); }
      25%      { transform: translate(10px, -2px); }
      50%      { transform: translate(8px, 8px); }
      75%      { transform: translate(-2px, 10px); }
    }
    @keyframes hk-far-5 {
      0%, 100% { transform: translate(0, 0); }
      40%      { transform: translate(-8px, -10px); }
      70%      { transform: translate(6px, 6px); }
    }
    @keyframes hk-far-6 {
      0%, 100% { transform: translate(0, 0); }
      20%      { transform: translate(-4px, 6px); }
      45%      { transform: translate(10px, -4px); }
      70%      { transform: translate(3px, 8px); }
    }
    @keyframes hk-spin-1 {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(8deg); }
    }
    @keyframes hk-spin-2 {
      0%, 100% { transform: rotate(6deg); }
      50%      { transform: rotate(-6deg); }
    }
    @keyframes hk-spin-3 {
      0%, 100% { transform: rotate(5deg); }
      30%      { transform: rotate(10deg); }
      70%      { transform: rotate(-4deg); }
    }
    @keyframes hk-spin-4 {
      0%, 100% { transform: rotate(3deg); }
      40%      { transform: rotate(-8deg); }
      80%      { transform: rotate(6deg); }
    }
    @keyframes hk-glitch-r {
      0%, 28%, 100% { opacity: 0; transform: translate(0, 0); }

      29% { opacity: 1; transform: translate(-3px, 0); }
      31% { opacity: 1; transform: translate(2px, 1px); }
      32% { opacity: 1; transform: translate(-3px, 0); }
      33% { opacity: 0; transform: translate(0, 0); }

      71% { opacity: 1; transform: translate(-6px, 0); }
      73% { opacity: 1; transform: translate(3px, -1px); }
      75% { opacity: 1; transform: translate(-2px, 0); }
      76% { opacity: 1; transform: translate(4px, 0); }
      78% { opacity: 1; transform: translate(-3px, 1px); }
      79% { opacity: 0; transform: translate(0, 0); }
    }
    @keyframes hk-glitch-c {
      0%, 17%, 100% { opacity: 0; transform: translate(0, 0); }

      18% { opacity: 1; transform: translate(5px, 0); }
      20% { opacity: 1; transform: translate(-2px, 1px); }
      21% { opacity: 1; transform: translate(3px, 0); }
      22% { opacity: 0; transform: translate(0, 0); }

      54% { opacity: 1; transform: translate(7px, -1px); }
      56% { opacity: 1; transform: translate(-3px, 0); }
      57% { opacity: 1; transform: translate(4px, 1px); }
      58% { opacity: 1; transform: translate(-2px, 0); }
      59% { opacity: 0; transform: translate(0, 0); }

      87% { opacity: 1; transform: translate(4px, 0); }
      89% { opacity: 1; transform: translate(-2px, 1px); }
      90% { opacity: 0; transform: translate(0, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .hk-r1, .hk-r2, .hk-r3, .hk-r4, .hk-r5, .hk-r6,
      .hk-r1b, .hk-r2b, .hk-r3b,
      .hk-r1c, .hk-r2c, .hk-r3c,
      .hk-f1, .hk-f2, .hk-f3, .hk-f4, .hk-f5, .hk-f6,
      .hk-s1, .hk-s2, .hk-s3, .hk-s4,
      .hk-glitch-r, .hk-glitch-c { animation: none; }
    }
  ]]></style>

  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Behind layer particles -->
  <g>
    <!-- Top strip -->
    <circle cx="150"  cy="80"  r="4"   fill="#f36303" opacity="0.35" class="hk-r1"  style="animation-delay: -2.6s" />
    <circle cx="360"  cy="120"  r="3"   fill="#878787" opacity="0.30" class="hk-r4"  style="animation-delay: -1.3s" />
    <circle cx="540"  cy="105" r="5"   fill="#f36303" opacity="0.30" class="hk-r3"  style="animation-delay: -4.2s" />
    <circle cx="710"  cy="60"  r="3"   fill="#878787" opacity="0.30" class="hk-r1b" />
    <circle cx="870"  cy="90"  r="4"   fill="#ffb280" opacity="0.40" class="hk-r2b" />
    <circle cx="1100" cy="55"  r="2.5" fill="#f36303" opacity="0.35" class="hk-f5"  style="animation-delay: -3.7s" />

    <!-- Bottom strip -->
    <circle cx="180"  cy="540" r="4"   fill="#f36303" opacity="0.30" class="hk-r6"  style="animation-delay: -2.5s" />
    <circle cx="400"  cy="580" r="3"   fill="#878787" opacity="0.30" class="hk-f4"  style="animation-delay: -2.8s" />
    <circle cx="610"  cy="530" r="5"   fill="#ffb280" opacity="0.40" class="hk-r5"  style="animation-delay: -1.4s" />
    <circle cx="800"  cy="565" r="3"   fill="#f36303" opacity="0.35" class="hk-r3c" style="animation-delay: -3.5s" />
    <circle cx="1020" cy="540" r="4"   fill="#878787" opacity="0.25" class="hk-r2"  style="animation-delay: -3.0s" />

    <!-- Middle strip -->
    <circle cx="60"   cy="200" r="3"   fill="#878787" opacity="0.25" class="hk-f6"  style="animation-delay: -2.0s" />
    <circle cx="1145" cy="200" r="3"   fill="#ffb280" opacity="0.40" class="hk-f2"  style="animation-delay: -1.5s" />
    <circle cx="1170" cy="290" r="3"   fill="#f36303" opacity="0.30" class="hk-f4"  style="animation-delay: -7.5s" />
    <circle cx="40"   cy="380" r="3.5" fill="#f36303" opacity="0.30" class="hk-r4"  style="animation-delay: -8.7s" />
    <circle cx="50"   cy="490" r="2.5" fill="#878787" opacity="0.25" class="hk-f1"  style="animation-delay: -7.0s" />
    <circle cx="1140" cy="460" r="2.5" fill="#ffb280" opacity="0.35" class="hk-f6"  style="animation-delay: -8.5s" />
    <circle cx="370"  cy="285" r="2"   fill="#ffb280" opacity="0.30" class="hk-f5"  style="animation-delay: -9.0s" />
    <circle cx="770"  cy="305" r="2"   fill="#f36303" opacity="0.25" class="hk-f2"  style="animation-delay: -6.0s" />
    <circle cx="910"  cy="290" r="2"   fill="#878787" opacity="0.25" class="hk-f5"  style="animation-delay: -9.0s" />
    <circle cx="620"  cy="372" r="2"   fill="#ffb280" opacity="0.30" class="hk-f2"  style="animation-delay: -6.0s" />
  </g>

  <!-- Bracket / syntax accents -->
  <g font-family="ui-monospace, 'SF Mono', 'Fira Code', Menlo, monospace" fill="#878787" opacity="0.30" font-weight="300">
    <g class="hk-s1"                                ><text x="290"  y="80"  font-size="36" class="hk-r3"  >{</text></g>
    <g class="hk-s2"                                ><text x="934"  y="150" font-size="36" class="hk-r1c" style="animation-delay: -7.5s">&gt;</text></g>
    <g class="hk-s3"                                ><text x="40"   y="310" font-size="32" class="hk-r1"  style="animation-delay: -5.5s">&lt;</text></g>
    <g class="hk-s4"                                ><text x="1140" y="360" font-size="32" class="hk-r3b" >}</text></g>
    <g class="hk-s1" style="animation-delay: -3.5s" ><text x="340"  y="520" font-size="32" class="hk-r2c" >/</text></g>
    <g class="hk-s2" style="animation-delay: -5.0s" ><text x="944"  y="605" font-size="28" class="hk-r1"  style="animation-delay: -9.4s">;</text></g>
  </g>

  <!-- Centered content group (static) -->
  <g transform="translate(600, 315) scale(0.78)">
    <!-- Logo icon -->
    <g transform="translate(-615, -120)">
      <defs>
        <mask id="ht-mask">
          <rect width="240" height="240" rx="45" fill="#ffffff"/>
          <g transform="scale(3.75)">
            <rect x="14" y="16" width="8"  height="32" rx="1" fill="#000000"/>
            <rect x="42" y="16" width="8"  height="32" rx="1" fill="#000000"/>
            <rect x="24" y="28" width="16" height="8"  rx="1" fill="#000000"/>
            <rect x="28" y="28" width="8"  height="20" rx="1" fill="#000000"/>
          </g>
        </mask>
      </defs>
      <rect width="240" height="240" rx="45" fill="#f36303" mask="url(#ht-mask)"/>
    </g>

    <!-- HackerTok text -->
    <text x="135" y="15" font-family="Verdana, Geneva, sans-serif" font-size="160" font-weight="bold" text-anchor="middle">
      <tspan fill="#f36303">Hacker</tspan><tspan fill="#878787">Tok</tspan>
    </text>

    <!-- Tagline -->
    <g>
      <!-- Red layer (revealed left during glitch) -->
      <text x="145" y="105" font-family="Verdana, Geneva, sans-serif" font-weight="bold" font-size="53" fill="#ff6666" fill-opacity="0.6" text-anchor="middle" class="hk-glitch-r">
        Your daily dose of Hacker News
      </text>
      <!-- Cyan layer (revealed right during glitch) -->
      <text x="145" y="105" font-family="Verdana, Geneva, sans-serif" font-weight="bold" font-size="53" fill="#66ffff" fill-opacity="0.6" text-anchor="middle" class="hk-glitch-c">
        Your daily dose of Hacker News
      </text>
      <!-- Main layer (always visible, painted on top) -->
      <text x="145" y="105" font-family="Verdana, Geneva, sans-serif" font-weight="bold" font-size="53" fill="#ffb280" text-anchor="middle">
        Your daily dose of Hacker News
      </text>
    </g>
  </g>
</svg>