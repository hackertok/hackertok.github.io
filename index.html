<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>HackerTok</title>
    <meta name="title" content="HackerTok - Your daily dose of Hacker News" />
    <meta name="description" content="A modern Hacker News client. Swipe or scroll through stories, read comments, and enjoy dark mode. Works beautifully on any device." />
    
    <!-- Theme Colors (with dark mode support) -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hackertok.github.io/" />
    <meta property="og:title" content="HackerTok - Your daily dose of Hacker News" />
    <meta property="og:description" content="A modern Hacker News client. Swipe or scroll through stories, read comments, and enjoy dark mode. Works beautifully on any device." />
    <meta property="og:image" content="https://hackertok.github.io/icons/og-image.png" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://hackertok.github.io/" />
    <meta name="twitter:title" content="HackerTok - Your daily dose of Hacker News" />
    <meta name="twitter:description" content="A modern Hacker News client. Swipe or scroll through stories, read comments, and enjoy dark mode. Works beautifully on any device." />
    <meta name="twitter:image" content="https://hackertok.github.io/icons/og-image.png" />
    
    <!-- Preconnect to APIs for faster first request -->
    <!-- Algolia first: homepage uses it for initial stories -->
    <link rel="preconnect" href="https://hn.algolia.com" />
    <link rel="dns-prefetch" href="https://hn.algolia.com" />
    <!-- Firebase: used for comments and other sections -->
    <link rel="preconnect" href="https://hacker-news.firebaseio.com" />
    <link rel="dns-prefetch" href="https://hacker-news.firebaseio.com" />
    
    <script>
      // Prevent flash of wrong theme
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-gray-950">
    <script>
      // Prevent scrollbar flash on mobile (swipe mode hides body overflow)
      // React will manage this class properly once hydrated
      (function() {
        var isMobile = window.innerWidth < 768;
        var hash = window.location.hash || '#/';
        // Swipe routes: /, /show, /ask, /best, /item/*
        var isSwipeRoute = /^#\/(show|ask|best|item\/)?/.test(hash);
        if (isMobile && isSwipeRoute) {
          document.body.classList.add('swipe-mode');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
