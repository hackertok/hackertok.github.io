<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- color-scheme on :root + html.light/html.dark in index.css pins UA
         surfaces (scrollbars etc.) to the in-app theme; this meta opts the UA
         into both schemes first. -->
    <meta name="color-scheme" content="light dark" />

    <!-- HashRouter has no crawlable per-route URLs, so one site-level canonical is correct. -->
    <link rel="canonical" href="https://hackertok.github.io/" />

    <!-- Primary Meta Tags -->
    <title>HackerTok</title>
    <meta name="title" content="HackerTok - Your daily dose of Hacker News" />
    <meta name="description" content="An open-source, blazingly fast, progressive Hacker News client. Swipe or scroll through stories, read comments, and install as an app." />
    
    <!-- Status-bar / browser-chrome color. Single JS-controlled tag (no media
         query) so it tracks the *app* theme, not just the OS scheme. The
         bootstrap script below sets the correct value before first paint and
         ThemeProvider keeps it in sync on toggle / OS change. Keep these hex
         values in sync with THEME_COLORS in src/context/ThemeContext.tsx. -->
    <meta name="theme-color" content="#fffdfb" />
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HackerTok" />
    <meta property="og:url" content="https://hackertok.github.io/" />
    <meta property="og:title" content="HackerTok - Your daily dose of Hacker News" />
    <meta property="og:description" content="An open-source, blazingly fast, progressive Hacker News client. Swipe or scroll through stories, read comments, and install as an app." />
    <meta property="og:image" content="https://hackertok.github.io/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HackerTok - Your daily dose of Hacker News" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://hackertok.github.io/" />
    <meta name="twitter:title" content="HackerTok - Your daily dose of Hacker News" />
    <meta name="twitter:description" content="An open-source, blazingly fast, progressive Hacker News client. Swipe or scroll through stories, read comments, and install as an app." />
    <meta name="twitter:image" content="https://hackertok.github.io/icons/og-image.png" />

    <!-- Minimal WebSite node; its supported use is Google's "site name"
         selection (the `name` property). No per-item nodes (hash routes aren't crawlable). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "HackerTok",
      "url": "https://hackertok.github.io/"
    }
    </script>

    <!-- Preconnect to APIs for faster first request -->
    <!-- Algolia first: homepage uses it for initial stories -->
    <link rel="preconnect" href="https://hn.algolia.com" />
    <link rel="dns-prefetch" href="https://hn.algolia.com" />
    <!-- Firebase: used for comments and other sections -->
    <link rel="preconnect" href="https://hacker-news.firebaseio.com" />
    <link rel="dns-prefetch" href="https://hacker-news.firebaseio.com" />
    
    <script>
      // Redirect non-hash paths into HashRouter (e.g. /item/123 → /#/item/123)
      // Handles: Vite SPA fallback in dev, direct URL entry, shared links without hash
      (function() {
        var p = window.location.pathname;
        if (p !== '/' && p !== '/index.html') {
          window.location.replace('/#' + p + window.location.search);
        }
      })();
    </script>
    <script>
      // Prevent flash of wrong theme, and set the initial status-bar color
      // before first paint so the Android PWA chrome matches the resolved theme.
      // Mirrors ThemeProvider: 'light'/'dark' are explicit pins; 'system' (and
      // any missing value) follows the OS color scheme.
      (function() {
        var mode = localStorage.getItem('setting:theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = mode === 'dark' || (mode !== 'light' && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', isDark ? '#241e1a' : '#fffdfb');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <script>
      // Prevent scrollbar flash on mobile (swipe mode hides body overflow).
      // React manages the class once hydrated, so this has to reach the same
      // verdict useCanSwipe will — hence both of its questions, in its units.
      (function() {
        var canSwipe = !window.matchMedia('(min-width: 48rem)').matches
          && window.matchMedia('(pointer: coarse) and (hover: none)').matches;
        var hash = window.location.hash || '#/';
        var isSwipeRoute = /^#\/(show|ask|best|newest|item\/)?/.test(hash);
        if (canSwipe && isSwipeRoute) {
          document.documentElement.classList.add('swipe-mode');
          document.body.classList.add('swipe-mode');
        }
      })();
    </script>
    <noscript>You need to enable JavaScript to run HackerTok.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
