name: Deploy to GitHub Pages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Generate Worker bindings
        run: npm run worker:types

      - name: Verify generated Worker bindings are current
        run: git diff --exit-code -- worker/worker-configuration.d.ts

      - name: Worker typecheck
        run: npm run worker:typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test:run

      - name: Worker runtime tests
        run: npm run worker:test

      - name: Wrangler dry run
        run: npm run worker:dry-run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Browser tests
        run: npm run e2e

      - name: Build release artifact
        env:
          REQUIRE_PUSH_API_URL: '1'
          VITE_PUSH_API_URL: ${{ vars.PUSH_API_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

  backend:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build
    environment:
      name: push-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      PUSH_API_URL: ${{ vars.PUSH_API_URL }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
    steps:
      - name: Checkout release
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID PUSH_API_URL VAPID_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
          node --input-type=module -e "
            const url = new URL(process.env.PUSH_API_URL);
            if (url.username || url.password || url.pathname !== '/' || url.search || url.hash) {
              throw new Error('PUSH_API_URL must contain only an HTTPS origin');
            }
            if (url.protocol !== 'https:') {
              throw new Error('PUSH_API_URL must use HTTPS');
            }
            console.log('PUSH_API_URL=' + url.origin);
          " >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Render provisioned Worker configuration
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const path = 'worker/wrangler.jsonc';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            config.d1_databases[0].database_id = process.env.CLOUDFLARE_D1_DATABASE_ID;
            config.vars.VAPID_PUBLIC_KEY = process.env.VAPID_PUBLIC_KEY;
            config.vars.ALLOWED_ORIGINS = 'https://hackertok.github.io';
            config.vars.RELEASE_VERSION = process.env.RELEASE_VERSION;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          "

      - name: Apply expand-only D1 migrations
        run: npm run worker:migrate:remote

      - name: Deploy Worker
        run: npm run worker:deploy

      - name: Wait for bootstrap readiness
        run: |
          for attempt in $(seq 1 210); do
            headers="$(mktemp)"
            if curl --fail --silent \
              --dump-header "$headers" \
              "$PUSH_API_URL/health/ready" \
              --output /dev/null; then
              deployed_version="$(
                awk 'BEGIN { IGNORECASE=1 } /^x-hackertok-release:/ {
                  sub(/\r$/, "", $2); print $2
                }' "$headers"
              )"
              if [ "$deployed_version" = "$RELEASE_VERSION" ]; then
                rm -f "$headers"
                exit 0
              fi
            fi
            rm -f "$headers"
            sleep 20
          done
          echo "::error::Worker did not become ready within 70 minutes"
          exit 1

      - name: Smoke-test public push configuration
        run: |
          headers="$(mktemp)"
          curl --fail --silent --show-error \
            --dump-header "$headers" \
            "$PUSH_API_URL/health/ready" \
            --output /dev/null
          deployed_version="$(
            awk 'BEGIN { IGNORECASE=1 } /^x-hackertok-release:/ {
              sub(/\r$/, "", $2); print $2
            }' "$headers"
          )"
          if [ "$deployed_version" != "$RELEASE_VERSION" ]; then
            echo "::error::Smoke-test URL is not serving the deployed Worker version"
            exit 1
          fi
          curl --fail --silent --show-error \
            --header "Origin: https://hackertok.github.io" \
            "$PUSH_API_URL/v1/push/config" |
          node --input-type=module -e "
            let body = '';
            for await (const chunk of process.stdin) body += chunk;
            const config = JSON.parse(body);
            if (
              typeof config.enabled !== 'boolean' ||
              config.threshold !== 1000 ||
              typeof config.keyId !== 'string' ||
              config.keyId.length === 0 ||
              typeof config.applicationServerKey !== 'string' ||
              config.applicationServerKey.length < 80
            ) {
              throw new Error('Invalid push configuration response');
            }
          "

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
