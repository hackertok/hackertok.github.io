version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    groups:
      # @vitest/* peer-depends on the exact vitest version, so a lone bump of
      # any one of them fails `npm ci`; this group must stay first to win.
      vitest:
        patterns: ["vitest", "@vitest/*"]
        exclude-patterns: ["@vitest/eslint-plugin"]
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
