# License policy for AGPL v3 compatibility
# Only licenses compatible with AGPL v3 are allowed

allow:
  # Permissive licenses
  - MIT
  - ISC
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - 0BSD
  - Unlicense
  - CC0-1.0
  - WTFPL
  - Zlib
  - BlueOak-1.0.0
  - CC-BY-3.0
  - CC-BY-4.0
  - CC-BY-SA-3.0
  - CC-BY-SA-4.0
  - Python-2.0.1
  - Artistic-2.0
  - W3C
  - BSL-1.0

  # Copyleft licenses (compatible with AGPL v3)
  - GPL-2.0-or-later
  - GPL-3.0*
  - LGPL-*
  - AGPL-3.0*
  - MPL-2.0

# Fail on packages with no license detected
require-license: true

# Fail on non-SPDX license identifiers (catches vague "See LICENSE" text)
require-known-license: true

# Ignore packages that don't need license checking
ignore-packages:
  - hackertok      # Root package (we control its license)
  - "actions/*"    # GitHub Actions (detected by Grant's cataloger)
  - "sigstore/*"   # Sigstore actions (cosign-installer)
